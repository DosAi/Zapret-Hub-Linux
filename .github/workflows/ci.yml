name: Linux CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

  distro-installer-smoke:
    name: Installer smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kali rolling
            image: kalilinux/kali-rolling
            family: debian
            manager: apt-get
            status: supported
          - name: Debian stable
            image: debian:stable
            family: debian
            manager: apt-get
            status: supported
          - name: Fedora
            image: fedora:latest
            family: rhel
            manager: dnf
            status: supported
          - name: Arch Linux
            image: archlinux:latest
            family: arch
            manager: pacman
            status: supported
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            family: suse
            manager: zypper
            status: supported
          - name: Alpine OpenRC guard
            image: alpine:latest
            family: alpine
            manager: apk
            status: unsupported
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate installer in distribution container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            /bin/sh -c 'command -v bash >/dev/null 2>&1 || apk add --no-cache bash; bash scripts/ci/distro_smoke.sh "$@"' \
            -- "${{ matrix.family }}" "${{ matrix.manager }}" "${{ matrix.status }}"
