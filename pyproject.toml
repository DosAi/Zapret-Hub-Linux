[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zapret-hub"
version = "3.1.1"
description = "Kali Linux desktop hub for Zapret, Zapret2, Happ and TG WS Proxy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "certifi>=2024.0.0",
    "cryptography>=46.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
zapret-hub = "zapret_hub.main:main"
zapret-hub-linux = "zapret_hub.linux_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
