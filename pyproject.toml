[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zapret-hub"
version = "3.1.0"
description = "Kali Linux desktop hub for Zapret, Zapret2, Happ and TG WS Proxy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "certifi>=2024.0.0",
    "cryptography>=46.0.0",
    "pydivert>=3.1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    "pyinstaller>=6.6",
    "nuitka>=2.7",
    "Pillow>=10.0",
    "zstandard>=0.22",
]

[project.scripts]
zapret-hub = "zapret_hub.main:main"
zapret-hub-linux = "zapret_hub.linux_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
